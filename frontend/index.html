<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Scheduler</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Light Scheduler</h1>
      <div class="schedule-form">
        <div class="time-input">
          <label for="onTime">ON Time:</label>
          <input type="time" id="onTime" required />
        </div>
        <div class="time-input">
          <label for="offTime">OFF Time:</label>
          <input type="time" id="offTime" required />
        </div>
        <button id="submitSchedule">Set Schedule</button>
      </div>
      <div class="status">
        <h2>Current Status</h2>
        <div class="status-indicator">
          <span id="connectionStatus">Disconnected</span>
          <div id="lightStatus" class="light-bulb off"></div>
        </div>
        <div id="currentSchedule">
          <p>No schedule set</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
